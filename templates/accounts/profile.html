{% extends "base.html" %}
{% block title %}プロフィール{% endblock %}
{% block content %}
<div class="pagehead">
  <h1>プロフィール</h1>
  <a class="btn" href="{% url 'password_change' %}">パスワード変更</a>
</div>
<form method="post" class="card form">{% csrf_token %}
  <div class="field"><label>ユーザー名</label><input type="text" value="{{ user.username }}" disabled></div>
  {% include "includes/form_fields.html" %}
  <div class="actions"><button class="btn primary" type="submit">保存</button></div>
</form>
{% endblock %}
