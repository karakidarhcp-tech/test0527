{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="card form">{% csrf_token %}
  {% include "includes/form_fields.html" %}
  <div class="actions">
    <button class="btn primary" type="submit">変更する</button>
    <a class="btn" href="{% if user.is_staff and 'users' in request.path %}{% url 'user_list' %}{% else %}{% url 'profile' %}{% endif %}">キャンセル</a>
  </div>
</form>
{% endblock %}
